name: Custom code security backport

on:
  push:
    branches: [security/custom-pipeline-trust]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Prepare the Torch 2.3 test environment
        run: |
          mkdir .security-test-env
          cat > .security-test-env/pyproject.toml <<'TOML'
          [project]
          name = "diffusers-security-tests"
          version = "0.0.0"
          requires-python = ">=3.11,<3.12"
          dependencies = ["diffusers", "torch==2.3.0", "numpy==1.26.4", "huggingface-hub==0.23.2", "accelerate==1.14.0", "transformers==4.46.3", "pytest>=8,<9", "parameterized", "ruff==0.1.5"]
          [tool.uv.sources]
          diffusers = { path = "..", editable = true }
          TOML
          uv sync --project .security-test-env --python 3.11.15
      - name: Verify trust boundaries and CPU inference
        run: |
          uv run --project .security-test-env --no-sync python -m pytest tests/test_custom_code_security.py -q
          uv run --project .security-test-env --no-sync ruff check setup.py src/diffusers/__init__.py src/diffusers/utils/dynamic_modules_utils.py src/diffusers/pipelines/pipeline_loading_utils.py src/diffusers/pipelines/pipeline_utils.py src/diffusers/pipelines/pipeline_flax_utils.py src/diffusers/loaders/single_file.py tests/test_custom_code_security.py tests/pipelines/test_pipelines.py
